# Tự cập nhật dữ liệu SSI sau phiên, chạy trên máy chủ của GitHub (không cần bật máy cá nhân).
# Dữ liệu mới được commit vào repo -> Streamlit Community Cloud tự nhận và hiển thị.
name: Cập nhật dữ liệu SSI

on:
  schedule:
    # Cron của GitHub tính theo UTC (giờ VN = UTC + 7), thứ Hai–thứ Sáu. GitHub KHÔNG đảm bảo chạy đúng giờ:
    # lúc máy chủ đông lần chạy có thể trễ vài giờ hoặc bị bỏ, nên đặt nhiều mốc ở phút lẻ.
    #  - 15:15: lấy dữ liệu sớm ngay sau khi các sàn đóng cửa (HOSE 14:45, HNX/UPCoM 15:00).
    #  - 16:37: tải lại một lần để chốt số liệu cuối ngày (phòng khi lúc 15:15 SSI chưa tổng hợp xong).
    #  - 18:37, 20:37: dự phòng khi các mốc trước bị trễ/bỏ; nếu đã chốt rồi thì dừng ngay sau vài giây.
    - cron: "15 8 * * 1-5"      # 15:15
    - cron: "37 9 * * 1-5"      # 16:37
    - cron: "37 11 * * 1-5"     # 18:37
    - cron: "37 13 * * 1-5"     # 20:37
  workflow_dispatch:            # nút "Run workflow" để chạy tay / tải bù
    inputs:
      from_date:
        description: "Tải từ ngày (YYYY-MM-DD), để trống = cập nhật thường"
        required: false
      to_date:
        description: "Đến ngày (YYYY-MM-DD), để trống = hôm nay"
        required: false

permissions:
  contents: write               # chỉ cần quyền ghi nội dung repo để commit dữ liệu

concurrency:
  group: cap-nhat-du-lieu       # không cho hai lần cập nhật chạy chồng nhau
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Ho_Chi_Minh
      LIQUISENSE_RATE_LIMIT: "4"   # thấp hơn giới hạn 5 yêu cầu/giây cho an toàn
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30          # đủ lịch sử gần đây để biết dữ liệu hôm nay được commit lúc mấy giờ

      # Xác định PHIÊN cần có (không dùng ngày lịch): chạy trước 15:00 thì phiên cần có là ngày giao dịch liền trước
      # (GitHub hay dời lịch sang 0h–5h sáng hôm sau), bỏ qua thứ Bảy/Chủ nhật. Lần chạy theo lịch được bỏ qua nếu
      # kho đã có phiên đó và lần cập nhật gần nhất diễn ra từ 16:00 của phiên đó trở đi (số liệu đã chốt).
      - name: Kiểm tra đã có dữ liệu phiên mới nhất chưa
        id: check
        run: |
          NOW=$(date +%H%M)
          SESSION=$(date +%F)
          if (( 10#$NOW < 1500 )); then SESSION=$(date -d "$SESSION -1 day" +%F); fi
          while [ "$(date -d "$SESSION" +%u)" -ge 6 ]; do SESSION=$(date -d "$SESSION -1 day" +%F); done
          echo "session=${SESSION}" >> "$GITHUB_OUTPUT"
          FILE="data/daily_bars_${SESSION}.parquet"
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ] && [ -e "$FILE" ]; then
            # Thời điểm của lần cập nhật gần nhất (nhật ký job được commit mỗi lần chạy, kể cả khi số liệu không đổi)
            LAST=$(git log -1 --format=%cd --date=format-local:'%F %H%M' -- data/job_runs.csv)
            if [[ -n "$LAST" && ! "$LAST" < "${SESSION} 1600" ]]; then
              echo "Phiên ${SESSION} đã có và đã chốt (cập nhật lúc ${LAST}) — bỏ qua lần chạy này."
              SKIP=true
            else
              echo "Phiên ${SESSION} mới có dữ liệu sớm (cập nhật lúc ${LAST:-?}) — tải lại để chốt số liệu."
            fi
          else
            echo "Chưa có dữ liệu phiên ${SESSION} — tải dữ liệu."
          fi
          echo "skip=${SKIP}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài thư viện
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Tải dữ liệu từ SSI FastConnect
        if: steps.check.outputs.skip != 'true'
        env:
          SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
          SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
          FROM_DATE: ${{ github.event.inputs.from_date }}
          TO_DATE: ${{ github.event.inputs.to_date }}
        run: |
          ARGS="--khong-tinh-san"
          if [ -n "$FROM_DATE" ]; then ARGS="$ARGS --from-date $FROM_DATE"; fi
          if [ -n "$TO_DATE" ]; then ARGS="$ARGS --to-date $TO_DATE"; fi
          python scripts/update.py $ARGS
          # Tải bù riêng các mã bị lỗi (nếu có), cùng khoảng ngày
          if [ -s data/ma_loi.txt ]; then
            python scripts/update.py --chi-ma-loi $ARGS || echo "Vẫn còn mã lỗi, sẽ thử lại lần sau."
          fi

      # Tính sẵn bảng chỉ số và đưa lên GitHub Release "cache" TRƯỚC khi commit: khi Streamlit Cloud nhận commit
      # mới và khởi động lại, bảng tính sẵn đã có sẵn để tải (vài giây) thay vì tự tính lại (1–2 phút, ~1,6 GB RAM).
      # Không commit file này vào git vì file lớn đổi mỗi ngày sẽ làm repo phình rất nhanh.
      - name: Tính sẵn bảng chỉ số cho app
        if: steps.check.outputs.skip != 'true'
        run: python scripts/dong_goi_cache.py

      - name: Tải bảng tính sẵn lên GitHub Release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view cache >/dev/null 2>&1 || \
            gh release create cache --prerelease --title "Bảng chỉ số tính sẵn cho app" \
              --notes "Workflow tự cập nhật mỗi ngày. Không phải bản phát hành phần mềm."
          gh release upload cache dist/history.parquet dist/alerts.parquet dist/cache.json --clobber

      - name: Commit dữ liệu mới
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily_bars_*.parquet
          for f in data/job_runs.csv data/chat_luong_du_lieu.csv data/ma_loi.txt data/dieu_chinh_gia.csv; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Không có dữ liệu mới (ngày nghỉ hoặc SSI chưa có phiên mới)."
          else
            # Ghi đúng phiên mới nhất có trong kho (không phải ngày chạy workflow)
            LATEST=$(ls data/daily_bars_*.parquet | sort | tail -1 | sed -E 's/.*daily_bars_([0-9-]+)\.parquet/\1/')
            git commit -m "Dữ liệu SSI đến phiên $(date -d "$LATEST" +%d/%m/%Y)"
            git pull --rebase
            git push
          fi